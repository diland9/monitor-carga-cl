name: Consolidar y publicar

# Empaqueta los archivos sueltos de los dias cerrados, reconstruye el historico
# del dashboard y despliega GitHub Pages.
on:
  schedule:
    - cron: '30 5 * * *'      # 01:30 en Chile (UTC-4)
  workflow_dispatch:

concurrency:
  group: consolida
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  consolidar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Consolidar y reconstruir el historico
        run: python scripts/consolida.py

      - name: Publicar
        run: |
          git config user.name  "monitor-carga[bot]"
          git config user.email "monitor-carga@users.noreply.github.com"
          git add -A serie historico docs/data
          if git diff --staged --quiet; then
            echo "sin cambios"
            exit 0
          fi
          git commit -m "consolidacion $(TZ=America/Santiago date '+%Y-%m-%d')"
          git pull --rebase --autostash && git push

  desplegar:
    needs: consolidar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
