name: Consolidar y publicar

# Empaqueta los archivos sueltos de los dias cerrados, reconstruye el historico
# del dashboard y despliega GitHub Pages.
on:
  schedule:
    - cron: '30 5 * * *'      # 01:30 en Chile (UTC-4)
  workflow_dispatch:

concurrency:
  group: consolida
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  consolidar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Consolidar y reconstruir el historico
        run: python scripts/consolida.py

      - name: Publicar
        run: |
          git config user.name  "monitor-carga[bot]"
          git config user.email "monitor-carga@users.noreply.github.com"
          git config merge.ours.driver true
          git add -A serie historico docs/data
          if git diff --staged --quiet; then
            echo "sin cambios"
            exit 0
          fi
          git commit -m "consolidacion $(TZ=America/Santiago date '+%Y-%m-%d')"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            echo "reintento $i"
            sleep 5
          done
          exit 1
