name: Captura

# El cron nativo de GitHub Actions (`schedule:`) resulto muy poco confiable en
# la practica: desde el primer dia el intervalo real fue de 15-45 min en vez
# de 5, y con el tiempo se degrado a brechas de horas. La cadencia real ahora
# la da un disparador externo (Cloud Scheduler) que llama a este workflow por
# workflow_dispatch cada 5 min. Se saco el `schedule:` de aqui a proposito:
# dejarlo ademas del disparo externo solo genera corridas duplicadas que
# compiten por el mismo push y a veces chocan (rebase conflict).
on:
  workflow_dispatch:        # disparado por Cloud Scheduler cada 5 min; tambien permite correrlo a mano

# Evita que dos corridas se pisen al hacer push sobre la misma rama.
concurrency:
  group: captura
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  capturar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Capturar
        run: python scripts/captura.py

      - name: Publicar
        run: |
          git config user.name  "monitor-carga[bot]"
          git config user.email "monitor-carga@users.noreply.github.com"
          # docs/data/*.json(.gz) se reescriben enteros cada corrida: si dos
          # corridas quedan cerca, un rebase normal choca en esos archivos.
          # merge=ours (declarado en .gitattributes) hace que ante un
          # conflicto ahi se prefiera lo que ya esta en el remoto, que se
          # vuelve a regenerar igual en el siguiente ciclo.
          git config merge.ours.driver true
          git add serie estado metadatos docs/data
          if git diff --staged --quiet; then
            echo "sin cambios que publicar"
            exit 0
          fi
          git commit -m "captura $(TZ=America/Santiago date '+%Y-%m-%d %H:%M')"
          # Reintenta si otra corrida hizo push mientras tanto
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            echo "reintento $i"
            sleep 5
          done
          exit 1
